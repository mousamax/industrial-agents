# Tricky-user scenarios for the Interaction score (25 points): Synera rates "a short scripted conversation
# with tricky users" on whether the agent asks only what it needs, shows what it understood, and gives
# directions a person can follow. Each scenario is a fixed script of user turns on a real building.
#
# A scenario passes when every `checks` entry holds (code, on the tool calls of that turn) AND the judge
# finds every `expect` line met plus the three rubric points. Write the scenario first, watch it fail,
# then fix the agent. Run: uv run python -m app.agents.building_guide.scenarios
#
# checks: {turn: 1-based, tool: name, args: {subset that must match}}  -> that tool was called so in that turn
#         {turn, no_tool: name}                                          -> that tool was NOT called
#         {turn, max_words: n}                                           -> the reply is short (voice, hands full)
#
# Level 5 "live building" (live-* scenarios, scored as level5-addin): a turn {who: name, say: text} is a
# colleague in their own chat on the same building; `setup` lists scanner events recorded before anyone
# talks: {item, to, type (new item), day (0 today, -1 yesterday, 2 = in two days), time, by, source}.
#
# Creativity "room calendar" (calendar-* scenarios): events booked in rooms, data/calendars/<building id>.json.
#
# Level 4 "build by conversation" (draft-* scenarios, scored as level4-conversation): `plans` is a glob under
# synera-kit/data/ drafted fresh before the first turn, as the app does after an upload; `name_as` names it.
scenarios:
- name: first-day-coffee
  building: proc-factory-dev-003
  persona: New employee, first day, knows no room names.
  turns:
  - Hi, it's my first day here. Where can I get a coffee?
  - I'm at the entrance into Office corridor 0.16.
  checks:
  - {turn: 2, tool: route}
  expect:
  - Turn 1 names real kitchens with coffee machines or asks where they are, in one short question at most.
  - Turn 2 picks the nearest kitchen from Office corridor 0.16 and gives walking directions, without asking again.

- name: wrong-room-number
  building: proc-campus-dev-000
  persona: Visitor who misreads room numbers.
  turns:
  - How do I get from the main lobby to room 1.6?
  expect:
  - Treats "1.6" as Seminar room 1.06 (Floor 1), the only close match, and says so, or asks to confirm it in one short question.
  - Does not invent a room 1.6.

- name: which-cnc-mill
  building: proc-factory-dev-003
  persona: Service technician with a call about one specific machine.
  turns:
  - I'm a service technician, I got a call about CNC mill B. Where is it, and how do I get there from Main aisle H-B5?
  checks:
  - {turn: 1, tool: route}
  expect:
  - Identifies CNC mill H-A1-B in Production zone H-A1 (Ground floor).
  - Gives a route from Main aisle H-B5 with the distance.

- name: vague-press
  building: proc-factory-dev-003
  persona: Worker who says "the press" when the hall has several.
  turns:
  - Where's the press?
  checks:
  - {turn: 1, no_tool: route}
  expect:
  - Asks one short question listing the actual presses (drill presses and/or injection moulding machines) with where they are, instead of picking one silently.

- name: wheelchair-is-sticky
  building: proc-campus-dev-000
  persona: Wheelchair user who says it once.
  turns:
  - I use a wheelchair. How do I get from Main lobby 0.18 to Library 1.28?
  - Great, and from there to Lab 3.06?
  checks:
  - {turn: 1, tool: route, args: {step_free: true}}
  - {turn: 2, tool: route, args: {step_free: true}}
  expect:
  - Both routes are step-free (lifts, no stairs) and the second one starts at Library 1.28 without asking.

- name: lift-closed-mid-conversation
  building: proc-campus-dev-000
  persona: Facility update, then a wheelchair user.
  turns:
  - Heads up, Lift 1 is out of service today.
  - I'm in a wheelchair at Main lobby 0.18. Get me to Seminar room 2.06 please.
  checks:
  - {turn: 1, tool: set_closed}
  - {turn: 2, tool: route, args: {step_free: true}}
  expect:
  - Turn 1 confirms Lift 1 is noted as closed.
  - Turn 2's route does not use Lift 1 and names the lift it does use.

- name: change-of-mind
  building: proc-campus-dev-000
  persona: Student who changes their destination.
  turns:
  - Take me from Main lobby 0.18 to the canteen.
  - Actually, make it the library instead.
  checks:
  - {turn: 2, tool: route}
  expect:
  - Turn 2 routes from Main lobby 0.18 to Library 1.28 without asking where they are.

- name: hands-full-voice
  building: proc-factory-dev-003
  persona: Technician carrying parts, listening on a headset.
  turns:
  - hands full, I'm at the CNC mills, fastest way to the air compressor, keep it short
  checks:
  - {turn: 1, tool: route}
  - {turn: 1, max_words: 70}
  expect:
  - Short spoken-style directions from Production zone H-A1 to Logistics zone H-C5 that can be followed without looking at a screen.

- name: wide-pallet
  building: proc-factory-dev-003
  persona: Logistics worker moving a wide load.
  turns:
  - I'm moving a 1.2 m wide pallet on a pallet truck from Warehouse zone H-C2 to the quality lab. Can I get there?
  checks:
  - {turn: 1, tool: route, args: {step_free: true, min_width_m: 1.2}}
  expect:
  - Answers whether the pallet fits (every door at least 1.2 m, no steps) and gives the route or says clearly why not.

- name: not-in-this-building
  building: proc-factory-dev-003
  persona: Someone asking for something that doesn't exist here.
  turns:
  - Where's the swimming pool?
  checks:
  - {turn: 1, no_tool: route}
  expect:
  - Says plainly there is no swimming pool in this building and does not invent one.

- name: add-a-door
  building: proc-campus-dev-000
  persona: Facility manager editing the plan.
  turns:
  - Add a door between Seminar room 2.06 and Kitchen 2.07.
  - Yes, do it.
  expect:
  - Before changing the plan, says what it understood (which two rooms, on Floor 2) and what the door would change, and asks to confirm.
  - After "Yes, do it", the door is really added to the building (later routes can use it) and it says so; it never claims a change it did not make.

- name: cross-building-wheelchair
  building: evals/datasets/sites/demo-campus
  persona: Wheelchair user on a two-building site (Level 3), then the walkway closes.
  turns:
  - I'm in Lab 3.06 in the lecture centre and use a wheelchair. How do I get to the factory kitchen with the coffee machine on its ground floor?
  - The covered walkway is closed today. Can I still get there?
  checks:
  - {turn: 1, tool: route, args: {step_free: true}}
  - {turn: 2, tool: set_closed}
  expect:
  - Turn 1 gives a step-free route from Lab 3.06 across to a factory kitchen with a coffee machine, naming the walkway it uses between the buildings.
  - Turn 2 says there is no step-free way now (the other link starts at an entrance with steps), instead of inventing one.

- name: live-delivery-colleague
  building: proc-factory-dev-003
  persona: Two colleagues in their own chats. Goods-in reports a delivery; a machinist then looks for it.
  turns:
  - {who: goods-in, say: "Delivery just came in, a pallet of aluminium sheets. I put it in Logistics zone H-C5."}
  - {who: machinist, say: "Where are the aluminium sheets that came in today? I'm in Assembly zone H-A2."}
  checks:
  - {turn: 1, tool: move_item}
  - {turn: 2, tool: route}
  expect:
  - Turn 1 records the new pallet in Logistics zone H-C5 right away, without asking for confirmation, and says colleagues will see it.
  - Turn 2 (a different person, who never saw turn 1) finds the sheets in Logistics zone H-C5, says goods-in reported them, and gives walking directions there from Assembly zone H-A2.

- name: live-what-came-yesterday
  building: proc-factory-dev-003
  persona: Shift lead catching up on deliveries recorded by the dock scanners.
  setup:
  - {item: Pallet of steel tubes, type: pallet, to: Logistics zone H-C5, day: -1, time: "09:30", by: dock scanner}
  - {item: Crate of sensors, type: crate, to: Logistics zone H-C5, day: -1, time: "14:10", by: dock scanner}
  - {item: Pallet of steel tubes, to: Warehouse zone H-C3, day: -1, time: "16:45", by: forklift RFID, source: rfid}
  - {item: Crate of motor parts, type: crate, to: Warehouse zone H-C2, day: 2, time: "08:00", by: purchasing, source: app}
  turns:
  - What was delivered yesterday, and where is it now?
  - Anything arriving in the next few days?
  checks:
  - {turn: 1, tool: building_changes}
  expect:
  - Turn 1 names both deliveries from yesterday (the steel tubes and the sensors) and where each is now, noting that the steel tubes were moved on to Warehouse zone H-C3.
  - Turn 2 names the expected crate of motor parts, when it is due and that it will go to Warehouse zone H-C2, and does not claim it is already there.

- name: live-moved-machine
  building: proc-factory-dev-003
  persona: Maintenance moves a machine; an apprentice in another chat then needs it.
  turns:
  - {who: maintenance, say: "FYI we just moved Drill press H-A1 over to Assembly zone H-A2."}
  - {who: apprentice, say: "I'm in Kitchen 0.28. How do I get to Drill press H-A1? Where was it before?"}
  checks:
  - {turn: 1, tool: move_item}
  - {turn: 2, tool: route}
  expect:
  - Turn 1 records the move right away and says what it recorded.
  - Turn 2 routes the apprentice to Assembly zone H-A2 (the new place, not Production zone H-A1) and says it used to be in Production zone H-A1 and that maintenance moved it.

- name: draft-factory-from-photos
  plans: dev/proc-factory-dev-003/floor_*_plain.png
  name_as: Hall 7
  persona: Plant manager who just uploaded the plain floor plan images of their factory and wants it usable fast.
  turns:
  - I just uploaded the floor plans of Hall 7, our factory. What do you need from me?
  - The rooms on the ground floor are production halls, not bedrooms. Inside doors are standard, but the entrances are 3 m roller doors for forklifts.
  - Every floor is 4.5 m high. The rest is fine as it is.
  checks:
  - {turn: 1, tool: review_draft}
  - {turn: 2, tool: fix_draft, args: {field: room_type}}
  - {turn: 2, tool: fix_draft, args: {field: width_m}}
  - {turn: 3, tool: fix_draft, args: {field: height_m}}
  - {turn: 3, tool: accept_guesses}
  expect:
  - Turn 1 says in a line what was drafted (floors, rooms, doors), then asks about one or two open points in plain words (no question keys or ids), most uncertain first.
  - Turn 2 records the ground floor rooms as production halls and only the entrances as 3 m wide, says what it changed, and moves on to a next open point or says none is left.
  - Turn 3 records 4.5 m storeys, accepts the rest, and says the building is ready to ask about.

- name: draft-correct-the-plan
  plans: dev/proc-factory-dev-003/floor_[01].svg
  name_as: Werk Süd
  persona: Facility manager who knows the drafted plan has two mistakes and corrects them in one go.
  turns:
  - "Before you ask me anything, two fixes: Production zone H-A1 is called Milling hall now, and all the entrances are 4 m roller doors."
  - Can a forklift get from outside into Milling hall now?
  checks:
  - {turn: 1, tool: fix_draft, args: {field: name}}
  - {turn: 1, tool: fix_draft, args: {field: width_m}}
  - {turn: 2, tool: route}
  expect:
  - Turn 1 renames Production zone H-A1 to Milling hall and sets the entrances (not every door) to 4 m, and confirms both in a line.
  - Turn 2 answers from a route call with forklift width (3 m or more), using the new name, and says plainly if no route fits and why.

- name: calendar-hackathon-guest
  building: data/MUCL
  persona: Guest arriving at the Munich Urban Colab who only knows the name of the event.
  turns:
  - Hi, I'm a guest. Where is the hackathon?
  checks:
  - {turn: 1, tool: calendar}
  - {turn: 1, tool: route}
  expect:
  - Finds the hackathon in the room calendar in the „Offener Bürobereich Süd“ on the third floor (F3), says it is on now, and gives walking directions there from the reception (Eingangsbereich / Empfang) without asking where the guest is.
