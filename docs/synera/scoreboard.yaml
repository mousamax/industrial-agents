# The team scoreboard: Synera's 100 points split into rows we can measure, each with an owner.
# `uv run ia scoreboard` turns every row into points (stake × measured rate) and writes SCOREBOARD.md.
#
# Stakes are OUR estimate of how Synera's judging (docs/synera/README.md) splits its points; change them
# when Synera tells us more. Rows start red: a row without an eval scores 0 until someone writes one.
# Owners share a row's points equally.
#
# Sources:
#   pytest: [test name prefixes]  free, run every time (golden tests, strict: unimplemented = fail)
#   bench: <suite>, kinds: [...]  agent on dev with the judges' scorer; refreshed with --run
#   scenarios: true               tricky-user scenarios with the rubric judge; refreshed with --run
#   manual: 0.0-1.0               the owner sets it, with a note saying what's done
#   missing: <what eval to write> no eval yet: 0 points

people: {A: Magnus, B: Vadim, C: Mousa, D: Maximilian}

rows:
# ---- Does it work (55) ----------------------------------------------------------------------------------
- id: test-geometry
  part: Does it work
  what: Area, wall, stacking and 3D questions answered right end to end (dev, judges' scorer)
  owners: [B, C]
  stake: 12  # 104 of 145 test questions, of ~20 points for the test set
  bench: benchmark
  kinds: [largest_room, floor_area_total, shared_walls_count, room_stacked, straight_line_3d]
- id: test-graph
  part: Does it work
  what: Errand, delivery, reachability and what-if questions answered right end to end
  owners: [A, C]
  stake: 6  # 41 of 145 test questions
  bench: benchmark
  kinds: [errand, wide_delivery_count, step_free_reachable_count, what_if_door]
- id: sunday-find-and-route
  part: Does it work
  what: Sunday-style find, count, route, step-free, closure and tour questions through the agent
  owners: [C, A]
  stake: 6
  bench: warmup
- id: sunday-answers-json
  part: Does it work
  what: 'The Sunday run from the PDF: one command, any building folder + questions.json -> answers.json with item/room ids, valid best routes as node ids, lengths; documented in BENCHMARK.md (no model: deterministic answerer)'
  owners: [C, A]
  stake: 5
  pytest: [test_sunday_]
- id: synera-route-rule
  part: Does it work
  what: Routes are the best under Synera's announced rule (per-metre stairs/lifts, forklift, bays)
  owners: [A]
  stake: 8
  pytest: [test_a4_]
- id: unseen-wording
  part: Does it work
  what: The scored kinds asked in other words (reworded dev questions)
  owners: [C]
  stake: 2
  bench: reworded
- id: unseen-kinds
  part: Does it work
  what: 12 question kinds Synera hasn't shown, on test buildings, answers computed by code (held out, score only)
  owners: [C]
  stake: 3
  bench: holdout
- id: level4-from-svg
  part: Does it work
  what: Buildings drafted from SVG floor plans match the truth (Level 4)
  owners: [B]
  stake: 5
  pytest: [test_drafted_, test_draft_]
- id: level4-from-images
  part: Does it work
  what: Buildings drafted from plan images (PNG, e.g. floor_<level>_plain.png) match the truth (Level 4)
  owners: [B]
  stake: 5
  pytest: [test_png_]
- id: level4-conversation
  part: Does it work
  what: "Level 4 by conversation: upload floor plans, get a building in seconds, and settle what the plans don't say by talking (grouped questions, fixes, forklift doors, storey heights)"
  owners: [C, B]
  stake: 0
  pytest: [test_drafting_]
  scenarios: [draft-]
- id: level3-multibuilding
  part: Does it work
  what: Several buildings joined by walkways, routed as one site (Level 3; site.json, demo site in evals/datasets/sites)
  owners: [A]
  stake: 3
  pytest: [test_level3_]

# ---- Interaction (25) -----------------------------------------------------------------------------------
- id: tricky-users
  part: Interaction
  what: Scripted tricky-user conversations pass the rubric (asks only what it needs, shows understanding, followable)
  owners: [C]
  stake: 11
  scenarios: true
- id: walk-directions
  part: Interaction
  what: 'Directions a person can follow: turns (left/right, never compass), landmarks, "go around the printer", from geometry (app.building.directions, agent tool walk_directions)'
  owners: [A, C]
  stake: 4
  pytest: [test_directions_]
- id: voice
  part: Interaction
  what: Voice in and out in the app
  owners: [D]
  stake: 5
  manual: 0.8
  note: "in: mic button, Web Speech API (Chrome, Edge, Safari); out: Read aloud + spoken answers on request. Gap: hands-full-voice scenario"
- id: ui-shows-it
  part: Interaction
  what: The app draws routes and highlights what the agent understood, on the floor plan
  owners: [D]
  stake: 5
  manual: 1.0
  note: "checked in the browser 2026-10-25: routes, highlights, the right floor and 3D on factory, campus, MUCL"

# ---- Creativity (10) and Submission demo (10) -----------------------------------------------------------
- id: level5-addin
  part: Creativity
  what: 'Level 5 "live building": things move and deliveries arrive ("this is now here" in chat, or a barcode/RFID scan), every colleague and the map see it at once, and time questions work (delivered yesterday, where was it, arriving Monday)'
  owners: [A, B, C, D]
  stake: 0
  pytest: [test_live_]
  scenarios: [live-]
- id: room-calendar
  part: Creativity
  what: "Room calendar add-in: rooms are calendar resources (as in Google or Outlook), so a guest asking for an event (\"where is the hackathon?\") is guided to the room it's booked in today (demo bookings in data/calendars/)"
  owners: [C]
  stake: 10
  pytest: [test_calendar_]
  scenarios: [calendar-]
- id: demo-video
  part: Submission demo
  what: Demo video and short technical explanation
  owners: [D]
  stake: 10
  manual: 0.0
  note: not started

